name: Backend checks

on:
  push:
    branches:
      - main
      - fix/production-backend-from-tested-core
      - fix/linc-backend-clean-pr
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        with:
          node-version: 22
          cache: npm
        uses: actions/setup-node@v4
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
