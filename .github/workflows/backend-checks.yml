name: Backend checks

on:
  push:
    branches:
      - main
      - fix/production-backend-from-tested-core
      - fix/linc-backend-clean-pr
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        with:
          node-version: 22
          cache: npm
        uses: actions/setup-node@v7
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check db.js
          node --check controllers.js
          node --check error-handler.js
          node --check request-validation.js
          node --check internal-assertion.js
      - name: Run unit tests
        run: npm test
