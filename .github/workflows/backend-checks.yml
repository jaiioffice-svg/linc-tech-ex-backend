name: Backend checks

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - fix/production-backend-from-tested-core
      - fix/linc-backend-clean-pr
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        with:
          node-version: 22
          cache: npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check db.js
          node --check controllers.js
          node --check error-handler.js
          node --check request-validation.js
          node --check internal-assertion.js
      - name: Run unit tests
        run: npm test
