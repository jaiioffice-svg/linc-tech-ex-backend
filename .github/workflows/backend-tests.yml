name: Backend tests

on:
  push:
    branches:
      - main
      - fix/vercel-readonly-filesystem
      - fix/heartbeat-guardian-security
      - fix/supabase-readiness-diagnostics
  pull_request:
    branches:
      - main
      - fix/vercel-readonly-filesystem
      - fix/heartbeat-guardian-security

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
