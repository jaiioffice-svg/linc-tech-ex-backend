name: Backend tests

on:
  push:
    branches:
      - main
      - fix/vercel-readonly-filesystem
      - fix/heartbeat-guardian-security
  pull_request:
    branches:
      - main
      - fix/vercel-readonly-filesystem

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
